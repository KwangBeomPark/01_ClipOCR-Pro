      <text x="25" y="29" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">⚙️</text>
      <text x="46" y="26" fill="#f8fafc" font-size="12" font-weight="600">Text Formatting &amp; Sensitive Data Masking</text>
      <text x="46" y="42" fill="#94a3b8" font-size="10.5">• Markdown Table formatting for easy pasting into Excel, Notion, or Jira</text>
